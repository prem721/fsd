<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set 1 Q1 - User Details Form</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;line-height:1.5}label{display:block;margin-top:10px}input,textarea{padding:6px;width:100%;box-sizing:border-box}button{margin-top:12px;padding:8px 16px;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border:1px solid #444;padding:8px;text-align:left}th{background:#eee}#out,#msg{margin-top:14px;font-weight:bold}
</style>
</head>
<body>
<h2>User Details</h2>
<form id="userForm">
<label>First Name <input type="text" id="firstName" name="firstName" required></label>
<label>Last Name <input type="text" id="lastName" name="lastName" required></label>
<label>Email <input type="email" id="email" name="email" required></label>
<button type="submit">Submit</button>
</form>
<p id="msg"></p>
<script>
document.getElementById('userForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var f = document.getElementById('firstName').value;
  var l = document.getElementById('lastName').value;
  var m = document.getElementById('email').value;
  document.getElementById('msg').textContent = 'Submitted: ' + f + ' ' + l + ' (' + m + ')';
});
</script>
</body>
</html>
