<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set 10 Q1 - Positioning</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;line-height:1.5}label{display:block;margin-top:10px}input,textarea{padding:6px;width:100%;box-sizing:border-box}button{margin-top:12px;padding:8px 16px;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border:1px solid #444;padding:8px;text-align:left}th{background:#eee}#out,#msg{margin-top:14px;font-weight:bold}.parent{position:relative;width:320px;height:200px;background:#dfe9f5;border:2px solid #345;padding:8px;box-sizing:border-box}.child{position:absolute;top:50px;right:15px;width:130px;height:90px;background:tomato;color:#fff;padding:8px;box-sizing:border-box}
</style>
</head>
<body>
<h2>CSS Positioning</h2>
<div class="parent">Relative box (parent)
<div class="child">Absolute box</div>
</div>
</body>
</html>
