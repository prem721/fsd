<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set 6 Q1 - Hover Effects</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;line-height:1.5}label{display:block;margin-top:10px}input,textarea{padding:6px;width:100%;box-sizing:border-box}button{margin-top:12px;padding:8px 16px;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border:1px solid #444;padding:8px;text-align:left}th{background:#eee}#out,#msg{margin-top:14px;font-weight:bold}nav{background:#333;padding:12px}nav a{color:#fff;text-decoration:none;margin-right:20px;transition:color .3s}nav a:hover{color:#ffcc00}#box{margin-top:25px;padding:40px;background:#cfe8ff;text-align:center;transition:background .3s}#box:hover{background:#ffd6a5}
</style>
</head>
<body>
<nav>
<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Contact</a>
</nav>
<div id="box">Hover over this box to change its background color</div>
</body>
</html>
