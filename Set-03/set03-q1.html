<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set 3 Q1 - Basic Layout</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;line-height:1.5}label{display:block;margin-top:10px}input,textarea{padding:6px;width:100%;box-sizing:border-box}button{margin-top:12px;padding:8px 16px;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border:1px solid #444;padding:8px;text-align:left}th{background:#eee}#out,#msg{margin-top:14px;font-weight:bold}header,footer{background:#333;color:#fff;padding:10px 20px;text-align:center}section{padding:15px;border:1px solid #ccc;margin:15px 0}
</style>
</head>
<body>
<header><h1>My Website</h1></header>
<section>
<article>
<h2>Welcome</h2>
<p>This is an article inside a section, built with HTML5 structural elements.</p>
</article>
</section>
<footer><p>&copy; 2026 My Website</p></footer>
</body>
</html>
