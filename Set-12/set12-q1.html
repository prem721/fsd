<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set 12 Q1 - Registration Form</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;line-height:1.5}label{display:block;margin-top:10px}input,textarea{padding:6px;width:100%;box-sizing:border-box}button{margin-top:12px;padding:8px 16px;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border:1px solid #444;padding:8px;text-align:left}th{background:#eee}#out,#msg{margin-top:14px;font-weight:bold}
</style>
</head>
<body>
<h2>Registration</h2>
<form id="rf">
<label>Full Name <input type="text" id="name" required></label>
<label>Date of Birth <input type="date" id="dob" required></label>
<label>Email <input type="email" id="email" required></label>
<label>Phone Number <input type="tel" id="phone" pattern="[0-9]{10}" title="Enter a 10-digit number" required></label>
<label>Profile Picture <input type="file" id="pic" accept="image/*"></label>
<button type="submit">Register</button>
</form>
<p id="msg"></p>
<script>
document.getElementById('rf').addEventListener('submit', function (e) {
  e.preventDefault();
  document.getElementById('msg').textContent = 'Registration successful for ' + document.getElementById('name').value + '.';
});
</script>
</body>
</html>
