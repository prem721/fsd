<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set 11 Q1 - Semantic Layout</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;line-height:1.5}label{display:block;margin-top:10px}input,textarea{padding:6px;width:100%;box-sizing:border-box}button{margin-top:12px;padding:8px 16px;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border:1px solid #444;padding:8px;text-align:left}th{background:#eee}#out,#msg{margin-top:14px;font-weight:bold}header,footer{background:#333;color:#fff;text-align:center;padding:10px}nav{background:#ddd;padding:10px;text-align:center}nav a{margin:0 10px}.wrap{display:flex;gap:15px;margin:15px 0}main{flex:3}aside{flex:1;background:#f3f3f3;padding:10px}
</style>
</head>
<body>
<header><h1>Semantic Layout</h1></header>
<nav><a href="#">Home</a> <a href="#">About</a> <a href="#">Contact</a></nav>
<div class="wrap">
<main>
<section>
<h2>Main Section</h2>
<article>
<h3>Article Title</h3>
<p>This is an article inside a section.</p>
</article>
</section>
</main>
<aside><h3>Sidebar</h3><p>Related links and extra information.</p></aside>
</div>
<footer><p>&copy; 2026 Semantic Layout</p></footer>
</body>
</html>
