<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set 5 Q2 - Click Event</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;line-height:1.5}label{display:block;margin-top:10px}input,textarea{padding:6px;width:100%;box-sizing:border-box}button{margin-top:12px;padding:8px 16px;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border:1px solid #444;padding:8px;text-align:left}th{background:#eee}#out,#msg{margin-top:14px;font-weight:bold}
</style>
</head>
<body>
<h2>Click Event Listener</h2>
<p id="para">This text will turn red when you click the button.</p>
<button id="btn">Make Text Red</button>
<script>
document.getElementById('btn').addEventListener('click', function () {
  const p = document.getElementById('para');
  p.textContent = 'This text is now red!';
  p.style.color = 'red';
});
</script>
</body>
</html>
