<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set 14 Q1 - To-Do List</title>
<style>
body{font-family:Arial,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;line-height:1.5}label{display:block;margin-top:10px}input,textarea{padding:6px;width:100%;box-sizing:border-box}button{margin-top:12px;padding:8px 16px;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border:1px solid #444;padding:8px;text-align:left}th{background:#eee}#out,#msg{margin-top:14px;font-weight:bold}
</style>
</head>
<body>
<h2>To-Do List</h2>
<input type="text" id="task" placeholder="Enter a task">
<button id="add">Add</button>
<ul id="list"></ul>
<script>
const tasks = [];
const input = document.getElementById('task');
const list = document.getElementById('list');

function render() {
  list.innerHTML = '';
  tasks.forEach(function (t) {
    const li = document.createElement('li');
    li.textContent = t;
    list.appendChild(li);
  });
}
function addTask() {
  const value = input.value.trim();
  if (value === '') return;
  tasks.push(value);
  input.value = '';
  render();
}
document.getElementById('add').addEventListener('click', addTask);
input.addEventListener('keydown', function (e) { if (e.key === 'Enter') addTask(); });
</script>
</body>
</html>
